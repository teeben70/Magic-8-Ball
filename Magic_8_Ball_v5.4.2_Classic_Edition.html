  <style>
    :root {
      color-scheme: dark;
      --bg1: #05050a;
      --bg2: #121225;
      --panel: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.16);
      --text: #f5f7ff;
      --muted: #b9bdd2;
      --blue: #275cff;
      --blue2: #0c2aa8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 20%, rgba(60,72,180,.3), transparent 35%),
        radial-gradient(circle at 20% 90%, rgba(20,70,160,.18), transparent 35%),
        linear-gradient(160deg, var(--bg2), var(--bg1) 70%);
    }

    .app {
      width: min(100%, 560px);
      text-align: center;
    }

    h1 {
      margin: 0 0 2px;
      font-size: clamp(2rem, 8vw, 3.2rem);
      letter-spacing: -.05em;
    }

    .subtitle {
      margin: 0 auto 10px;
      color: var(--muted);
      line-height: 1.45;
    }

    .question-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mic-button {
      width: auto;
      min-width: 58px;
      padding-inline: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: none;
      font-size: 1.25rem;
    }

    .mic-button.listening {
      background: linear-gradient(180deg, #ff5d72, #b91935);
      animation: pulseMic 1s ease-in-out infinite;
    }

    @keyframes pulseMic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    input {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      font: inherit;
      color: var(--text);
      background: var(--panel);
      outline: none;
    }

    input:focus {
      border-color: rgba(93,135,255,.9);
      box-shadow: 0 0 0 3px rgba(55,100,255,.18);
    }

    .ball-stage {
      display: grid;
      place-items: center;
      min-height: 270px;
      margin: 0 0 8px;
      perspective: 900px;
    }

    .ball {
      position: relative;
      width: min(72vw, 295px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 34% 25%, #595966 0 2%, #24242d 10%, #09090e 46%, #000 78%);
      border: 2px solid rgba(255,255,255,.1);
      box-shadow:
        inset -26px -36px 70px rgba(0,0,0,.9),
        inset 18px 15px 40px rgba(255,255,255,.08),
        0 28px 60px rgba(0,0,0,.65);
      transform-style: preserve-3d;
      user-select: none;
      cursor: pointer;
    }

    .ball::after {
      content: "";
      position: absolute;
      width: 54%;
      height: 14%;
      bottom: -8%;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      filter: blur(15px);
      z-index: -1;
    }

    .window {
      width: 59%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 38% 30%, #ffffff 0%, #f4f4f4 48%, #d5d5d5 100%);
      border: none;
      box-shadow:
        inset -12px -16px 25px rgba(0,0,0,.22),
        inset 10px 8px 18px rgba(255,255,255,.9),
        0 0 0 3px #14141a;
      transition: background .5s ease, box-shadow 0s, border-color 0s;
    }
.answer {
      width: 100%;
      color: #000;
      font-size: clamp(1rem, 4.2vw, 1.35rem);
      font-weight: 800;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
      transition: opacity .18s ease, transform .18s ease;
    }

    .answer.changing {
      opacity: 0;
      transform: translateY(10px) scale(.92);
    }

    .eight {
      font-size: clamp(5.3rem, 23vw, 9.2rem);
      line-height: .85;
      transform: translateY(-5%);
    }

    .shaking {
      animation: shakeBall .18s ease-in-out infinite;
    }

    .holding {
      transform: scale(.985);
      box-shadow:
        inset -26px -36px 70px rgba(0,0,0,.9),
        inset 18px 15px 40px rgba(255,255,255,.08),
        0 18px 45px rgba(0,0,0,.7);
    }

    /* Subtle glass highlight that shifts during movement. */
    .ball::after {
      content: "";
      position: absolute;
      width: 34%;
      height: 20%;
      left: 21%;
      top: 12%;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(255,255,255,.16) 0%,
        rgba(255,255,255,.07) 42%,
        rgba(255,255,255,0) 74%
      );
      filter: blur(7px);
      transform: rotate(-18deg);
      pointer-events: none;
      opacity: .68;
      transition: transform .35s ease, opacity .35s ease;
    }

    .ball.shaking::after {
      animation: lensGlint .46s ease-in-out infinite alternate;
      opacity: .82;
    }

    @keyframes lensGlint {
      from { transform: translate(-5px, 2px) rotate(-20deg) scale(.98); }
      to   { transform: translate(8px, -3px) rotate(-14deg) scale(1.04); }
    }

    /* A brief inertial settle after the shake stops. */
    .ball.settling {
      animation: settleWobble .72s cubic-bezier(.22,.7,.2,1);
    }

    @keyframes settleWobble {

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function stopListeningUI() {
      listening = false;
      micButton.classList.remove("listening");
      micButton.textContent = "🎤";
      micButton.setAttribute("aria-label", "Speak your question");
    }

    function setupSpeechRecognition() {
      if (!SpeechRecognition) {
        micButton.disabled = true;
        micButton.title = "Speech recognition is not supported in this browser";
        status.textContent = "Voice transcription is unavailable here. Try Google Chrome on Android.";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = navigator.language || "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.addEventListener("start", () => {
        listening = true;
        micButton.classList.add("listening");
        micButton.textContent = "■";
        micButton.setAttribute("aria-label", "Stop listening");
        status.textContent = "Listening… speak your question.";
      });

      recognition.addEventListener("result", event => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        question.value = transcript.trim();
        status.textContent = event.results[event.results.length - 1].isFinal
          ? "Question transcribed. Tap Ask the 8 Ball."
          : "Listening…";
      });

      recognition.addEventListener("end", stopListeningUI);

      recognition.addEventListener("error", event => {
        stopListeningUI();

        const messages = {
          "not-allowed": "Microphone permission was denied. Allow microphone access in Chrome site settings.",
          "service-not-allowed": "Speech service is blocked in this browser.",
          "no-speech": "I did not hear anything. Tap the microphone and try again.",
          "audio-capture": "No microphone was detected.",
          "network": "Speech recognition needs an internet connection in this browser."
        };

        status.textContent = messages[event.error] || `Voice transcription error: ${event.error}`;
      });

      micButton.addEventListener("click", () => {
        try {
          if (listening) {
            recognition.stop();
          } else {
            recognition.start();
          }
        } catch (error) {
          status.textContent = "The microphone is already starting. Try again in a moment.";
        }
      });
    }

        "Ask again later":            { lines: ["ASK", "AGAIN", "LATER"], dir: "up", offset: 0, fontScale: 0.84 },

        "Don't count on it":          { lines: ["DON'T", "COUNT", "ON IT"], dir: "up", offset: 0, fontScale: 0.82 },
        "My reply is no":             { lines: ["MY REPLY", "IS", "NO"], dir: "down", offset: -38, fontScale: 0.82 },
        "My sources say no":          { lines: ["MY", "SOURCES", "SAY", "NO"], dir: "down", offset: -30, fontScale: 0.76 },
        "Outlook not so good":        { lines: ["OUTLOOK", "NOT SO", "GOOD"], dir: "down", offset: -38, fontScale: 0.78 },
        "Very doubtful":              { lines: ["VERY", "DOUBTFUL"], dir: "up", offset: 4, fontScale: 0.88 }
      };

      const layout = layouts[text] || { lines: [text.toUpperCase()], dir: "down" };
      const lines = layout.lines;
      windowEl.classList.add(layout.dir === "up" ? "face-up" : "face-down");

      answer.innerHTML = lines.map((line, index) => {
        const total = lines.length;
        let width;

        if (layout.dir === "down") {
          if (total === 1) width = 72;
          else if (total === 2) width = [96, 62][index];
          else if (total === 3) width = [100, 74, 48][index];
          else width = [100, 82, 62, 42][index] || 42;
        } else {
          if (total === 1) width = 62;
          else if (total === 2) width = [58, 96][index];
          else if (total === 3) width = [48, 72, 100][index];
          else width = [42, 62, 82, 100][index] || 100;
        }

        return `<span class="answer-line" style="width:${width}%">${line}</span>`;
      }).join("");

      const answerY = layout.offset ?? (layout.dir === "up" ? 7 : -36);
      answer.style.setProperty("--answer-y", `${answerY}%`);
      answer.style.transform = `translateY(${answerY}%)`;

      answer.style.fontSize = layout.fontScale
        ? `calc(.64rem * ${layout.fontScale})`
        : "";

      if (text === "Concentrate and ask again") {
        answer.classList.add("concentrate");
      }
    }

    function revealAnswerWithFade(text) {
      answer.classList.remove("revealing");
      answerWindow.classList.remove("revealing-die");
      answer.classList.add("preparing-reveal");
      answerWindow.classList.add("preparing-die");
      setAnswerText(text);

      // Paint the fully hidden die and text before beginning the staged reveal.
      void answerWindow.offsetWidth;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          // Keep the hidden class in place and add the visible state.
          // This lets the same pseudo-elements transition continuously without blinking.
          answerWindow.classList.add("revealing-die");

          // Let the triangle establish itself before the text begins.
          setTimeout(() => {
            answer.classList.remove("preparing-reveal");
            void answer.offsetWidth;
            answer.classList.add("revealing");
            startFluidEffects();
          }, 700);

          setTimeout(() => {
            answerWindow.classList.remove("preparing-die", "revealing-die");
            answer.classList.remove("revealing");
          }, 1500);
        });
      });
    }


    function chooseBubbleCount() {
      const roll = Math.random();
      if (roll < 0.45) return 0;
      if (roll < 0.80) return 2 + Math.floor(Math.random() * 2);
      if (roll < 0.95) return 4 + Math.floor(Math.random() * 2);
      return 6 + Math.floor(Math.random() * 3);
    }

    function clearMicrobubbles() {
      bubbleLayer.replaceChildren();
    }

    function createMicrobubbles() {
      clearMicrobubbles();
      const count = chooseBubbleCount();
      if (!count) return;

      const fragment = document.createDocumentFragment();

      for (let i = 0; i < count; i++) {
        const bubble = document.createElement("span");
        bubble.className = "microbubble";

        // Keep bubbles mostly around the triangle edges and away from central text.
        const side = Math.random() < 0.5 ? "left" : "right";
        const left = side === "left"
          ? 10 + Math.random() * 24
          : 66 + Math.random() * 20;
        const top = 48 + Math.random() * 34;

        const size = 2 + Math.random() * 3.4;
        const drift = (-8 + Math.random() * 16).toFixed(1);
        const rise = 28 + Math.random() * 54;
        const duration = 1.8 + Math.random() * 1.35;
        const delay = .10 + Math.random() * .42;
        const opacity = .20 + Math.random() * .22;
        const blur = Math.random() < .34 ? (.55 + Math.random() * .8) : 0;

        bubble.style.setProperty("--left", `${left.toFixed(1)}%`);
        bubble.style.setProperty("--top", `${top.toFixed(1)}%`);
        bubble.style.setProperty("--size", `${size.toFixed(1)}px`);
        bubble.style.setProperty("--drift", `${drift}px`);
        bubble.style.setProperty("--rise", `${rise.toFixed(1)}px`);
        bubble.style.setProperty("--duration", `${duration.toFixed(2)}s`);
        bubble.style.setProperty("--delay", `${delay.toFixed(2)}s`);
        bubble.style.setProperty("--opacity", opacity.toFixed(2));
        bubble.style.setProperty("--blur", `${blur.toFixed(2)}px`);

        fragment.appendChild(bubble);
      }

      bubbleLayer.appendChild(fragment);
      setTimeout(clearMicrobubbles, 3800);
    }

    function startFluidEffects() {
      answerWindow.classList.remove("fluid-shimmer");
      answer.classList.remove("fluid-shimmer");
      void answerWindow.offsetWidth;
      answerWindow.classList.add("fluid-shimmer");
      answer.classList.add("fluid-shimmer");

      setTimeout(() => {
        answerWindow.classList.remove("fluid-shimmer");
        answer.classList.remove("fluid-shimmer");
      }, 520);

      setTimeout(createMicrobubbles, 130);
    }

    function pickAnswer() {
      let next;
      do {
        next = answers[Math.floor(Math.random() * answers.length)];
      } while (answers.length > 1 && next === lastAnswer);
      lastAnswer = next;
      return next;
    }

    function beginHolding() {
      holdingBall = true;
      ball.classList.add("holding");
      answer.classList.remove("revealing");
      status.textContent = motionEnabled
        ? "Think of your question, then tap the Magic 8 Ball."
        : "Enable shake detection first, then hold and shake.";
      if (navigator.vibrate) navigator.vibrate(25);
    }

    function endHolding() {
      holdingBall = false;
      ball.classList.remove("holding");
      if (!shakeSessionActive) {
        status.textContent = motionEnabled
          ? "Tap the Magic 8 Ball to receive your answer."
          : "Tap Magic 8 Ball to continue.";
      }
    }

    function beginShakeSession() {
      if (!holdingBall || shakeSessionActive) return;

      shakeSessionActive = true;
      clearTimeout(settleTimer);
      clearTimeout(revealTimer);
      clearMicrobubbles();

      ball.classList.add("shaking");
      answerWindow.classList.remove("face-up", "face-down", "preparing-die", "revealing-die");
      answerWindow.classList.add("answer-mode", "shaking-face");
      answer.classList.remove("revealing");
      answer.classList.add("thinking");
      answer.classList.remove("eight");
      answer.textContent = "";
      status.textContent = "The Magic 8 Ball is thinking…";

      if (navigator.vibrate) navigator.vibrate([40, 40, 40, 40, 40]);
    }

    function noteShakeMotion() {
      if (!shakeSessionActive) beginShakeSession();
      if (!shakeSessionActive) return;

      lastMotionAt = Date.now();
      clearTimeout(settleTimer);

      settleTimer = setTimeout(() => {
        if (Date.now() - lastMotionAt >= 700) finishShakeSession();
      }, 750);
    }

    function finishShakeSession() {
      if (!shakeSessionActive) return;

      shakeSessionActive = false;
      ball.classList.remove("shaking");
      ball.classList.remove("settling");
      void ball.offsetWidth;
      ball.classList.add("settling");
      setTimeout(() => ball.classList.remove("settling"), 760);
      answerWindow.classList.remove("shaking-face");
      answer.classList.remove("thinking");
      status.textContent = "The Magic 8 Ball is deciding…";

      revealTimer = setTimeout(() => {
        answerWindow.classList.add('answer-mode');
        revealAnswerWithFade(pickAnswer());
        if (navigator.vibrate) navigator.vibrate([70, 50, 110]);
        status.textContent = "Tap Magic 8 Ball to continue.";
      }, 1400);
    }


    function renderAppInfo() {
      document.title = `${APP_INFO.name} v${APP_INFO.version} — ${APP_INFO.edition}`;
      appVersion.textContent = `${APP_INFO.name} v${APP_INFO.version}`;
      appEdition.textContent = APP_INFO.edition;
      appBuild.textContent = `${APP_INFO.codename} • Build ${APP_INFO.buildDate}`;
    }

    renderAppInfo();

    function isFullscreenActive() {
      return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement
      );
    }

    function updateFullscreenButton() {
      const active = isFullscreenActive();
      fullscreenButton.classList.toggle("is-fullscreen", active);
      fullscreenButton.setAttribute(
        "aria-label",
        active ? "Exit full screen" : "Enter full screen"
      );
      fullscreenButton.title = active ? "Exit full screen" : "Enter full screen";
    }

    async function toggleFullscreen() {
      try {
        if (!isFullscreenActive()) {
          const root = document.documentElement;
          if (root.requestFullscreen) {
            await root.requestFullscreen();
          } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
          }
        } else if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (error) {
        status.textContent = "Full screen mode is not available in this browser.";
      }
    }

    fullscreenButton.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    updateFullscreenButton();

    function resetBall() {
      clearTimeout(revealTimer);
      clearTimeout(settleTimer);
      clearMicrobubbles();

      answerWindow.classList.remove("answer-mode", "shaking-face", "preparing-die", "revealing-die");
      answer.classList.remove("revealing", "preparing-reveal", "thinking", "changing");
      answer.classList.add("eight");
      answer.textContent = "8";
      answer.style.removeProperty("font-size");
      answer.style.removeProperty("--answer-y");
      answer.style.removeProperty("transform");
      answer.style.removeProperty("opacity");
      answer.style.removeProperty("filter");
      ball.classList.remove("shaking", "holding", "settling");
      status.textContent = "Tap Magic 8 Ball to continue.";
      if (navigator.vibrate) navigator.vibrate(35);
    }

    function tapFallback() {
      tapCount++;
      tapCounter.textContent = `Tap Counter: ${tapCount}`;

      if (motionEnabled) {
        status.textContent = "Touch and hold the ball while shaking your phone.";
        return;
      }

      answer.classList.remove("eight", "thinking", "revealing");
      answer.textContent = "";
      answerWindow.classList.remove("face-up", "face-down", "preparing-die", "revealing-die");
      answerWindow.classList.add("answer-mode", "shaking-face");
      ball.classList.add("shaking");
      status.textContent = "The Magic 8 Ball is deciding…";

      setTimeout(() => {
        ball.classList.remove("shaking");
        ball.classList.remove("settling");
        void ball.offsetWidth;
        ball.classList.add("settling");
        setTimeout(() => ball.classList.remove("settling"), 760);
        answerWindow.classList.remove("shaking-face");
        answerWindow.classList.add('answer-mode');
        revealAnswerWithFade(pickAnswer());
        status.textContent = "Tap Magic 8 Ball to continue.";
        if (navigator.vibrate) navigator.vibrate([70, 50, 110]);
      }, 1600);
    }

    function handleMotion(event) {
      const a = event.accelerationIncludingGravity;
      if (!a || a.x == null || a.y == null || a.z == null) return;

      if (lastX == null) {
        lastX = a.x; lastY = a.y; lastZ = a.z;
        return;
      }

      const delta = Math.abs(a.x - lastX) + Math.abs(a.y - lastY) + Math.abs(a.z - lastZ);
      lastX = a.x; lastY = a.y; lastZ = a.z;

      const now = Date.now();
      if (delta > 15 && now - lastShakeAt > 120) {
        lastShakeAt = now;
        noteShakeMotion();
      }
    }

    async function enableMotion() {
      try {
        if (typeof DeviceMotionEvent === "undefined") {
          status.textContent = "Motion sensors are not available in this browser.";
          return;
        }

        if (typeof DeviceMotionEvent.requestPermission === "function") {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission !== "granted") {
            status.textContent = "Motion permission was not granted.";
            return;
          }
        }

        window.addEventListener("devicemotion", handleMotion, { passive: true });
        motionEnabled = true;
        motionButton.textContent = "Shake Detection Enabled";
        motionButton.disabled = true;
        status.textContent = "Tap the Magic 8 Ball to receive your answer.";
      } catch (error) {
        status.textContent = "Could not enable motion detection. You can still use the button.";
      }
    }

    askButton.addEventListener("click", tapFallback);

    ball.addEventListener("pointerdown", event => {
      event.preventDefault();
      beginHolding();
    });

    ball.addEventListener("pointerup", endHolding);
    ball.addEventListener("pointercancel", endHolding);
    ball.addEventListener("pointerleave", event => {
      if (event.pointerType === "mouse") endHolding();
    });

    ball.addEventListener("click", event => {
      if (!motionEnabled && !shakeSessionActive) tapFallback();
    });

    ball.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        tapFallback();
      }
    });
    question.addEventListener("keydown", event => {
      if (event.key === "Enter") revealAnswer();
    });
    motionButton.addEventListener("click", enableMotion);
    refreshButton.addEventListener("click", resetBall);
    setupSpeechRecognition();
  </script>
</body>
</html>
